<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Home Control</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .device {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .device h2 {
            margin-top: 0;
        }

        .status {
            margin-bottom: 15px;
            font-weight: bold;
        }

        button {
            padding: 10px 18px;
            margin-right: 8px;
            border: none;
            border-radius: 5px;
            background-color: #dddddd;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #cccccc;
        }

        button.active {
            background-color: #333;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>Smart Home Control</h1>
    <p>System Dashboard</p>
</header>

<div class="container">

    <!-- Smart Light -->
    <div class="device">
        <h2>Smart Light</h2>

        <div class="status">
            Status: <span id="light-status">OFF</span>
        </div>

        <button onclick="setState('light', 'OFF', this)" class="active">
            OFF
        </button>

        <button onclick="setState('light', 'ON', this)">
            ON
        </button>

        <button onclick="setState('light', 'AUTO', this)">
            AUTO
        </button>
    </div>


    <!-- Smart Outlet -->
    <div class="device">
        <h2>Smart Outlet</h2>

        <div class="status">
            Status: <span id="outlet-status">OFF</span>
        </div>

        <button onclick="setState('outlet', 'OFF', this)" class="active">
            OFF
        </button>

        <button onclick="setState('outlet', 'ON', this)">
            ON
        </button>
    </div>


    <!-- Humidifier -->
    <div class="device">
        <h2>Humidifier</h2>

        <div class="status">
            Status: <span id="humidifier-status">OFF</span>
        </div>

        <button onclick="setState('humidifier', 'OFF', this)" class="active">
            OFF
        </button>

        <button onclick="setState('humidifier', 'LOW', this)">
            LOW
        </button>

        <button onclick="setState('humidifier', 'HIGH', this)">
            HIGH
        </button>
    </div>

</div>


<script>

function setState(device, state, button) {

    // Update displayed status
    document.getElementById(device + "-status").textContent = state;

    // Find the device section
    const deviceSection = button.parentElement;

    // Remove active state from all buttons in this device
    const buttons = deviceSection.querySelectorAll("button");

    buttons.forEach(function(btn) {
        btn.classList.remove("active");
    });

    // Highlight selected button
    button.classList.add("active");

    // HTTP communication will be added later
    console.log(device + " changed to " + state);
}

</script>

</body>
</html>
