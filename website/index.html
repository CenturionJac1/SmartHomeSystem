
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Home Control</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            margin-bottom: 5px;
        }

        header p {
            margin-top: 0;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .device {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .device h2 {
            margin-top: 0;
        }

        .status {
            margin-bottom: 15px;
            font-weight: bold;
        }

        button {
            padding: 10px 18px;
            margin-right: 8px;
            margin-bottom: 5px;
            border: none;
            border-radius: 5px;
            background-color: #dddddd;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #cccccc;
        }

        button.active {
            background-color: #333;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            font-size: 14px;
            margin-top: 10px;
            color: #c0392b;
        }

        .note {
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <h1>Smart Home Control</h1>
    <p>System Dashboard</p>
</header>

<div class="container">

    <!-- Smart Light -->
    <div class="device">

        <h2>Smart Light</h2>

        <div class="status">
            Status:
            <span id="light-status">UNKNOWN</span>
        </div>

        <button onclick="setState('light', 'OFF', this)">
            OFF
        </button>

        <button onclick="setState('light', 'ON', this)">
            ON
        </button>

        <button onclick="setState('light', 'AUTO', this)">
            AUTO
        </button>

        <p id="light-message" class="message"></p>

    </div>

    <!-- Smart Outlet -->
    <div class="device">

        <h2>Smart Outlet</h2>

        <div class="status">
            Status:
            <span id="outlet-status">OFF</span>
        </div>

        <button
            onclick="setState('outlet', 'OFF', this)"
            class="active">
            OFF
        </button>

        <button onclick="setState('outlet', 'ON', this)">
            ON
        </button>

        <p class="note">Demo mode - hardware integration pending.</p>

    </div>

    <!-- Humidifier -->
    <div class="device">

        <h2>Humidifier</h2>

        <div class="status">
            Status:
            <span id="humidifier-status">OFF</span>
        </div>

        <button
            onclick="setState('humidifier', 'OFF', this)"
            class="active">
            OFF
        </button>

        <button onclick="setState('humidifier', 'LOW', this)">
            LOW
        </button>

        <button onclick="setState('humidifier', 'HIGH', this)">
            HIGH
        </button>

        <p class="note">Demo mode - hardware integration pending.</p>

    </div>

</div>

<script>

/*
 * Smart Home Web Interface
 *
 * Smart Light commands are sent to the Central Controller
 * through HTTP.
 *
 * Smart Outlet and Humidifier remain demo-only until
 * their controller endpoints are implemented.
 */

// Central Controller IP address.
// Confirm this address during hardware testing.
const API_BASE = "http://192.168.1.100";

const REQUEST_TIMEOUT = 5000;

// Node and light identifiers used by the controller.
// Confirm these values with the communications firmware.
const LIGHT_NODE_ID = 1;
const LIGHT_ID = 1;

// Prevent multiple simultaneous commands to the same device.
const pendingDevices = new Set();


/*
 * Send a control command to the Central Controller.
 *
 * Smart Light request:
 *
 * POST /control
 * Content-Type: application/json
 *
 * {
 *     "node": 1,
 *     "light": 1,
 *     "state": "on"
 * }
 */
async function sendCommand(device, state) {

    const command = state.toLowerCase();

    // Other devices are not supported by the controller yet.
    if (device !== "light") {
        console.log("Demo mode:", device, command);
        return true;
    }

    const controller = new AbortController();

    const timeout = setTimeout(() => {
        controller.abort();
    }, REQUEST_TIMEOUT);

    try {

        const response = await fetch(`${API_BASE}/control`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                node: LIGHT_NODE_ID,
                light: LIGHT_ID,
                state: command
            }),
            signal: controller.signal
        });

        if (!response.ok) {
            throw new Error(
                "Controller returned HTTP " + response.status
            );
        }

        const result = await response.json();

        if (result.success !== true) {
            throw new Error(
                result.message ||
                result.error ||
                "Controller did not confirm the command."
            );
        }

        console.log(
            "Smart Light command successful:",
            result
        );

        return true;

    } catch (error) {

        console.error(
            "Controller request failed:",
            error
        );

        const message =
            error.name === "AbortError"
                ? "Request timed out. Check the controller connection."
                : "Unable to control Smart Light: " + error.message;

        document.getElementById(
            "light-message"
        ).textContent = message;

        return false;

    } finally {

        clearTimeout(timeout);

    }
}


/*
 * Change the state of a device.
 *
 * 1. Send the command.
 * 2. Wait for the result.
 * 3. Update the displayed state only if successful.
 * 4. Highlight the selected button.
 */
async function setState(device, state, button) {

    if (pendingDevices.has(device)) {
        return;
    }

    pendingDevices.add(device);

    const deviceSection = button.closest(".device");

    const buttons =
        deviceSection.querySelectorAll("button");

    buttons.forEach(function(btn) {
        btn.disabled = true;
    });

    if (device === "light") {
        document.getElementById(
            "light-message"
        ).textContent = "";
    }

    try {

        const success =
            await sendCommand(device, state);

        if (!success) {
            return;
        }

        document.getElementById(
            device + "-status"
        ).textContent = state;

        buttons.forEach(function(btn) {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        console.log(
            device + " changed to " + state
        );

    } catch (error) {

        console.error(
            "Unexpected control error:",
            error
        );

        if (device === "light") {
            document.getElementById(
                "light-message"
            ).textContent = error.message;
        }

    } finally {

        pendingDevices.delete(device);

        buttons.forEach(function(btn) {
            btn.disabled = false;
        });

    }
}


/*
 * Retrieve controller status.
 *
 * This function is prepared for future status polling.
 * The exact response structure must be verified against
 * the controller firmware before updating device states.
 */
async function updateDeviceStatus() {

    const controller = new AbortController();

    const timeout = setTimeout(() => {
        controller.abort();
    }, REQUEST_TIMEOUT);

    try {

        const response = await fetch(`${API_BASE}/status`, {
            method: "GET",
            signal: controller.signal
        });

        if (!response.ok) {
            throw new Error(
                "Status request failed: HTTP " + response.status
            );
        }

        const status = await response.json();

        console.log("Controller status:", status);

        return status;

    } catch (error) {

        console.error(
            "Unable to retrieve controller status:",
            error
        );

        return null;

    } finally {

        clearTimeout(timeout);

    }
}

// Enable periodic status polling after the controller
// response format and hardware behavior are verified.
//
// setInterval(updateDeviceStatus, 5000);

</script>

</body>
</html>
